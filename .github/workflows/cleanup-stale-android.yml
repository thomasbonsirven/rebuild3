name: Cleanup stale Android builds

on:
  push:
    branches: ["main"]
    paths:
      - ".github/android-cleanup.trigger"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel stale runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 35531779135; do
            echo "Force cancelling $run_id"
            gh api --method POST "repos/${{ github.repository }}/actions/runs/$run_id/force-cancel" || true
          done
