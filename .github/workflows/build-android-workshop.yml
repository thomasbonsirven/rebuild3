name: Build Android Workshop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-workshop/**"
      - ".github/workflows/build-android-workshop.yml"
      - ".github/android-build.trigger"

permissions:
  contents: read

concurrency:
  group: android-workshop
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, rebuild3]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install or verify Android SDK
        timeout-minutes: 20
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $SdkRoot = "D:\\000-Rebuild3\\android-sdk"
          $SdkManager = Join-Path $SdkRoot "cmdline-tools\\latest\\bin\\sdkmanager.bat"
          $PlatformDir = Join-Path $SdkRoot "platforms\\android-35"
          $BuildToolsDir = Join-Path $SdkRoot "build-tools\\35.0.0"

          "ANDROID_HOME=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path $SdkManager)) {
            throw "sdkmanager missing: $SdkManager"
          }

          if ((Test-Path $PlatformDir) -and (Test-Path $BuildToolsDir)) {
            Write-Host "Android SDK 35 already installed."
            exit 0
          }

          $Licenses = Join-Path $SdkRoot "licenses"
          New-Item -ItemType Directory -Force -Path $Licenses | Out-Null
          @(
            "8933bad161af4178b1185d1a37fbf41ea5269c55",
            "d56f5187479451eabf01fb78af6dfcb131a6481e"
          ) | Set-Content -Path (Join-Path $Licenses "android-sdk-license") -Encoding ascii

          $YesFile = Join-Path $env:RUNNER_TEMP "sdk-yes.txt"
          (1..200 | ForEach-Object { "y" }) | Set-Content -Path $YesFile -Encoding ascii

          $InstallCmd = "type `"$YesFile`" | call `"$SdkManager`" --sdk_root=`"$SdkRoot`" --verbose `"platforms;android-35`" `"build-tools;35.0.0`""
          Write-Host "Installing Android platform/build-tools..."
          cmd.exe /d /c $InstallCmd

          if ($LASTEXITCODE -ne 0) {
            throw "sdkmanager failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $PlatformDir)) {
            throw "Android platform 35 still missing after sdkmanager"
          }
          if (-not (Test-Path $BuildToolsDir)) {
            throw "Android build-tools 35.0.0 still missing after sdkmanager"
          }

      - name: Prepare Gradle 8.9
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $GradleParent = "D:\000-Rebuild3\gradle"
          $GradleHome = Join-Path $GradleParent "gradle-8.9"
          $GradleBin = Join-Path $GradleHome "bin\gradle.bat"

          if (-not (Test-Path $GradleBin)) {
            Write-Host "Installing Gradle 8.9..."
            New-Item -ItemType Directory -Force -Path $GradleParent | Out-Null
            $Zip = Join-Path $env:RUNNER_TEMP "gradle-8.9-bin.zip"
            Remove-Item $Zip -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -OutFile $Zip
            Expand-Archive -LiteralPath $Zip -DestinationPath $GradleParent -Force
          }

          "GRADLE_BIN=$GradleBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $GradleBin --version

      - name: Build debug APK
        shell: powershell
        run: |
          & $env:GRADLE_BIN -p android-workshop --no-daemon clean assembleDebug

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path android-workshop-output | Out-Null
          Copy-Item "android-workshop\app\build\outputs\apk\debug\app-debug.apk" "android-workshop-output\Rebuild3Workshop-keyboard-v0.6.0.apk" -Force

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rebuild3Workshop-keyboard-v0.6.0
          path: android-workshop-output/Rebuild3Workshop-keyboard-v0.6.0.apk
          retention-days: 30
