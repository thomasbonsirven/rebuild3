name: Build Android Workshop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-workshop/**"
      - ".github/workflows/build-android-workshop.yml"
      - ".github/android-build.trigger"

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, rebuild3]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: powershell
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: powershell
        run: gradle -p android-workshop --no-daemon clean assembleDebug

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path android-workshop-output | Out-Null
          Copy-Item "android-workshop\app\build\outputs\apk\debug\app-debug.apk" "android-workshop-output\Rebuild3Workshop-keyboard-v0.2.0.apk" -Force

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rebuild3Workshop-keyboard-v0.2.0
          path: android-workshop-output/Rebuild3Workshop-keyboard-v0.2.0.apk
          retention-days: 30
