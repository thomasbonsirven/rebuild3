name: Build Android Workshop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-workshop/**"
      - ".github/workflows/build-android-workshop.yml"
      - ".github/android-build.trigger"

permissions:
  contents: read

concurrency:
  group: android-workshop
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, rebuild3]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $SdkRoot = "D:\000-Rebuild3\android-sdk"
          $SdkManager = Join-Path $SdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $SdkManager)) {
            Write-Host "Installing Android command-line tools..."
            $Zip = Join-Path $env:RUNNER_TEMP "android-commandline-tools.zip"
            $Extract = Join-Path $env:RUNNER_TEMP "android-commandline-tools"

            Remove-Item $Zip -Force -ErrorAction SilentlyContinue
            Remove-Item $Extract -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $Extract | Out-Null

            Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip" -OutFile $Zip
            Expand-Archive -LiteralPath $Zip -DestinationPath $Extract -Force

            New-Item -ItemType Directory -Force -Path (Join-Path $SdkRoot "cmdline-tools") | Out-Null
            $Latest = Join-Path $SdkRoot "cmdline-tools\latest"
            Remove-Item $Latest -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item (Join-Path $Extract "cmdline-tools") $Latest
          }

          $Licenses = Join-Path $SdkRoot "licenses"
          New-Item -ItemType Directory -Force -Path $Licenses | Out-Null
          @(
            "8933bad161af4178b1185d1a37fbf41ea5269c55",
            "d56f5187479451eabf01fb78af6dfcb131a6481e"
          ) | Set-Content -Path (Join-Path $Licenses "android-sdk-license") -Encoding ascii
          "84831b9409646a918e30573bab4c9c91346d8abd" |
            Set-Content -Path (Join-Path $Licenses "android-sdk-preview-license") -Encoding ascii

          "ANDROID_HOME=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$SdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          & $SdkManager --sdk_root=$SdkRoot "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle 8.9
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $GradleParent = "D:\000-Rebuild3\gradle"
          $GradleHome = Join-Path $GradleParent "gradle-8.9"
          $GradleBin = Join-Path $GradleHome "bin\gradle.bat"

          if (-not (Test-Path $GradleBin)) {
            Write-Host "Installing Gradle 8.9..."
            New-Item -ItemType Directory -Force -Path $GradleParent | Out-Null
            $Zip = Join-Path $env:RUNNER_TEMP "gradle-8.9-bin.zip"
            Remove-Item $Zip -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -OutFile $Zip
            Expand-Archive -LiteralPath $Zip -DestinationPath $GradleParent -Force
          }

          "GRADLE_BIN=$GradleBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $GradleBin --version

      - name: Build debug APK
        shell: powershell
        run: |
          & $env:GRADLE_BIN -p android-workshop --no-daemon clean assembleDebug

      - name: Prepare artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path android-workshop-output | Out-Null
          Copy-Item "android-workshop\app\build\outputs\apk\debug\app-debug.apk" "android-workshop-output\Rebuild3Workshop-overlay-v0.3.0.apk" -Force

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rebuild3Workshop-overlay-v0.3.0
          path: android-workshop-output/Rebuild3Workshop-overlay-v0.3.0.apk
          retention-days: 30
