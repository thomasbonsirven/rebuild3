name: Build full French pack

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Translate, validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: rebuild3_fr_output/translation_cache.json
          key: rebuild3-fr-google-cache-v1

      - name: Build French Android pack
        run: python build_rebuild3_fr.py --chunk-kb 180

      - name: Validate generated keys
        run: python validate_pack.py

      - name: Build downloadable ZIP
        run: |
          cd rebuild3_fr_output
          zip -r ../rebuild3-fr-site.zip site

      - uses: actions/upload-artifact@v4
        with:
          name: rebuild3-fr-site
          path: rebuild3-fr-site.zip

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: rebuild3_fr_output/site

      - name: Deploy full pack to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
