name: Build full French pack

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: full-french-pack
  cancel-in-progress: false

jobs:
  build:
    name: Translate and validate on Windows runner
    runs-on: [self-hosted, Windows, X64, rebuild3]
    timeout-minutes: 720

    env:
      REBUILD3_CACHE: 'D:\000-Rebuild3\cache\translation_cache_ollama.json'
      OLLAMA_MODEL: 'translategemma:4b-it-q4_K_M'
      OLLAMA_URL: 'http://127.0.0.1:11434'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: powershell
        run: |
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          python -m pip install -r requirements.txt

      - name: Prepare persistent local cache
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force 'D:\000-Rebuild3\cache' | Out-Null
          Write-Host "Persistent cache: $env:REBUILD3_CACHE"
          if (Test-Path $env:REBUILD3_CACHE) {
            $size = (Get-Item $env:REBUILD3_CACHE).Length
            Write-Host "Existing cache found: $size bytes"
          } else {
            Write-Host "No cache yet: first translation run"
          }

      - name: Check local Ollama
        shell: powershell
        run: |
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          try {
            $tags = Invoke-RestMethod -Method Get -Uri "$env:OLLAMA_URL/api/tags" -TimeoutSec 10
          } catch {
            throw "Ollama n'est pas joignable sur $env:OLLAMA_URL. Lance Ollama sur Windows puis relance le workflow."
          }
          $names = @($tags.models | ForEach-Object { $_.name })
          Write-Host "Modeles Ollama presents : $($names -join ', ')"
          if (-not ($names -contains $env:OLLAMA_MODEL)) {
            throw "Modele absent : $env:OLLAMA_MODEL. Execute : ollama pull $env:OLLAMA_MODEL"
          }

      - name: Build French Android pack with TranslateGemma
        shell: powershell
        run: |
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          python -u build_rebuild3_fr.py `
            --chunk-kb 180 `
            --cache "$env:REBUILD3_CACHE" `
            --provider ollama `
            --ollama-url "$env:OLLAMA_URL" `
            --ollama-model "$env:OLLAMA_MODEL" `
            --batch-size 20 `
            --batch-chars 6000

      - name: Validate generated keys
        shell: powershell
        run: |
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          python validate_pack.py

      - name: Add gameplay mods to published site
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force 'rebuild3_fr_output\site\mods' | Out-Null
          Copy-Item 'mods\config\apocalypse-vivante.txt' 'rebuild3_fr_output\site\mods\apocalypse-vivante.txt' -Force
          Copy-Item 'mods\config\coup-de-pouce.txt' 'rebuild3_fr_output\site\mods\coup-de-pouce.txt' -Force
          Copy-Item 'web\mods\index.html' 'rebuild3_fr_output\site\mods\index.html' -Force

      - name: Build downloadable ZIP
        shell: powershell
        run: |
          if (Test-Path 'rebuild3-fr-site.zip') {
            Remove-Item 'rebuild3-fr-site.zip' -Force
          }
          Compress-Archive -Path 'rebuild3_fr_output\site\*' -DestinationPath 'rebuild3-fr-site.zip' -CompressionLevel Optimal

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rebuild3-fr-site
          path: rebuild3-fr-site.zip

      - name: Upload Pages source
        uses: actions/upload-artifact@v4
        with:
          name: rebuild3-pages-source
          path: rebuild3_fr_output/site
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Pages source
        uses: actions/download-artifact@v4
        with:
          name: rebuild3-pages-source
          path: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy full pack to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
