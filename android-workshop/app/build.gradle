plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.tb.rebuild3workshop'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.tb.rebuild3workshop'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.6.0-keyboard'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
